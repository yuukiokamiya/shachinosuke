<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>パチスロ</title>
<style>
  * { box-sizing: border-box; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #1b1b2b; color: #fff;
    font-family: -apple-system, "Hiragino Sans", "Segoe UI", sans-serif; overflow: hidden; touch-action: manipulation; }
  /* ---- 横向きレイアウト ----
     --H = リール窓の高さ。画面の高さと幅の両方に収まる大きさにする。
     左の列（キャラ・レバー）は高さの0.45倍、リールは高さの1.37倍 */
  :root {
    --H: min(calc(100vh - 270px), calc((94vw - 30px) / 1.82));
    --S: calc(var(--H) * 0.45);                   /* 左の列の幅 */
    --W: calc(var(--H) * 1.82 + 24px + 2vw);      /* 全体の横幅 */
    --CHARA: 0.5;                                  /* キャラの高さ（リール高さに対する割合） */
  }
  @supports (height: 100dvh) {
    :root { --H: min(calc(100dvh - 270px), calc((94vw - 30px) / 1.82)); }
  }
  #machine { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.5vh; padding: 1.5vh; }
  #stage { display: grid; grid-template-columns: var(--S) auto; column-gap: 2vw; row-gap: 1.5vh; width: var(--W); }
  #side { grid-column: 1; grid-row: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; }
  #frame { grid-column: 2; grid-row: 1; }
  #leverBox { grid-column: 1; grid-row: 2; display: flex; justify-content: center; align-items: center; }
  #chara { display: block; height: calc(var(--H) * var(--CHARA)); width: auto;
    filter: drop-shadow(0 6px 12px #000a); visibility: hidden; }
  #chara.ready { visibility: visible; }

  /* 吹き出し */
  #bubble { position: relative; background: #fff; color: #1b1b2b; font-weight: 900; white-space: nowrap;
    font-size: calc(var(--H) * 0.045); padding: 0.45em 0.9em; border-radius: 1.2em; margin-bottom: 18px;
    box-shadow: 0 4px 12px #0009; }
  #bubble::after { content: ''; position: absolute; left: 50%; bottom: -16px; transform: translateX(-50%);
    border-left: 10px solid transparent; border-right: 10px solid transparent; border-top: 17px solid #fff; }
  #bubble.pop { animation: pop 0.35s ease-out; }
  @keyframes pop { 0% { transform: scale(0.5); } 60% { transform: scale(1.12); } 100% { transform: scale(1); } }

  /* レバー（押すと棒が手前に倒れて短く見える） */
  #lever { position: relative; width: clamp(70px, 12vh, 110px); height: clamp(70px, 12vh, 110px);
    background: none; border: none; padding: 0; }
  .lv-base { position: absolute; left: 50%; bottom: 6%; width: 50%; height: 24%; transform: translateX(-50%);
    border-radius: 50%; background: radial-gradient(ellipse at 50% 40%, #777, #1a1a1a 70%); box-shadow: 0 3px 6px #000a; }
  .lv-arm { position: absolute; left: 50%; bottom: 17%; width: 11%; height: 52%; transform: translateX(-50%);
    border-radius: 4px; background: linear-gradient(90deg, #777, #f2f2f2 45%, #888); transition: height 0.06s; }
  .lv-knob { position: absolute; left: 50%; top: 0; width: 520%; aspect-ratio: 1; transform: translate(-50%, -60%);
    border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ff9e9e, #e00000 50%, #6d0000);
    box-shadow: 0 4px 8px #000a; }
  #lever.pressed .lv-arm { height: 26%; }

  /* 停止ボタン（各リールの真下に配置） */
  #stops { grid-column: 2; grid-row: 2; display: grid; grid-template-columns: repeat(3, 1fr);
    column-gap: calc(var(--H) * 1.37 * 0.02); padding: 0 calc(12px + var(--H) * 1.37 * 0.02);
    justify-items: center; align-items: center; }
  .stop { position: relative; width: calc(var(--H) * 0.2); aspect-ratio: 1.45; border: none; border-radius: 12px; padding: 0;
    background: linear-gradient(#e3e6ea, #8a9097 60%, #5d6268); box-shadow: 0 5px 0 #33363a, 0 8px 14px #0009; }
  .stop::before { content: ''; position: absolute; inset: 15%; border-radius: 8px;
    background: radial-gradient(ellipse at 50% 35%, #5a2a2a, #2a0d0d 70%); box-shadow: inset 0 2px 5px #000; }
  .stop.on::before { background: radial-gradient(ellipse at 50% 35%, #ffffff, #7cc8ff 40%, #1166d6 85%);
    box-shadow: inset 0 0 6px #fff9, 0 0 16px #4af; }
  .stop.pressed { transform: translateY(4px); box-shadow: 0 1px 0 #33363a, 0 3px 6px #0009; }
  #panel { width: var(--W); display: flex; justify-content: space-between; align-items: center;
    background: #000; border-radius: 10px; padding: 10px 16px; font-size: clamp(14px, 2.2vw, 22px); }
  #result { font-weight: bold; color: #ffd84a; min-height: 1.3em; }
  #debug { color: #8fd; font-size: 0.8em; text-align: right; }
  #frame { background: linear-gradient(#c9a640, #8a6a16); padding: 12px; border-radius: 16px; box-shadow: 0 8px 30px #000a; }
  #reels { display: block; height: var(--H); width: calc(var(--H) * 1.37); background: #222; border-radius: 6px; }
  label { font-size: 0.8em; color: #aaa; }
  #panel { flex-direction: column; align-items: stretch; gap: 6px; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  #displays { display: flex; align-items: center; gap: clamp(10px, 2.5vw, 28px); }
  .disp { display: flex; flex-direction: column; align-items: center; font-size: 0.6em; color: #aaa; }
  /* 7セグメント表示器 */
  .seg { display: flex; gap: 0.08em; font-size: 2.8em; line-height: 1; padding: 0.12em 0.2em; border-radius: 4px;
    background: linear-gradient(#140000, #2a0503); box-shadow: inset 0 0 0 2px #000, inset 0 2px 6px #000; }
  .digit { display: inline-block; width: 0.62em; height: 1em; overflow: hidden; }
  .strip { display: flex; flex-direction: column; transition: transform 0.07s ease-out; }
  .strip span { display: block; height: 1em; }
  .strip svg { display: block; width: 0.62em; height: 1em; overflow: visible; }
  .strip .on { fill: #ff2a14; filter: drop-shadow(0 0 2px #ff3b1f) drop-shadow(0 0 5px #ff1a00aa); }
  .strip .off { fill: #3d0a06; }
  #betLamps { display: flex; gap: 6px; padding: 6px 0; }
  .lamp { width: 1.3em; height: 1.3em; border-radius: 50%; background: #332; border: 2px solid #554; font-size: 1.2em; }
  .lamp.on { background: radial-gradient(circle at 40% 35%, #fff6a0, #ffb300); border-color: #ffd54f; box-shadow: 0 0 10px #ffb300; }
  #replayLamp { color: #444; font-weight: bold; font-size: 1.1em; }
  #replayLamp.on { color: #4fc3f7; text-shadow: 0 0 8px #4fc3f7; }
  #stats { font-size: 0.75em; color: #ccc; }
  .small { border: none; border-radius: 8px; padding: 6px 12px; font-weight: bold; font-size: 0.75em; color: #fff; background: #555; }
  .small.pressed { transform: translateY(2px); }
  #lendBtn { background: #2e7d32; }
  #settleBtn { background: #6d4c41; }
</style>
</head>
<body>
<div id="machine">
  <div id="panel">
    <div class="row">
      <div id="displays">
        <div class="disp"><span class="seg" id="creditDisp"></span>CREDIT</div>
        <div class="disp"><div id="betLamps"><span class="lamp"></span><span class="lamp"></span><span class="lamp"></span></div>BET</div>
        <div class="disp"><span id="replayLamp">REPLAY</span></div>
        <div class="disp"><span class="seg" id="payDisp"></span>PAY</div>
      </div>
      <div id="result"></div>
    </div>
    <div class="row">
      <div id="stats"></div>
      <div id="debug" style="text-align:left; flex: 1"></div>
      <label><input type="checkbox" id="showFlag" checked> フラグ表示</label>
      <div>
        <button class="small" id="lendBtn">貸出 50枚</button>
        <button class="small" id="settleBtn">精算</button>
      </div>
    </div>
  </div>
  <div id="stage">
    <div id="side">
      <div id="bubble">しょうちのすけ</div>
      <img id="chara" alt="しゃちのすけ">
    </div>
    <div id="frame"><canvas id="reels"></canvas></div>
    <div id="leverBox">
      <button id="lever" aria-label="レバー"><span class="lv-base"></span><span class="lv-arm"><span class="lv-knob"></span></span></button>
    </div>
    <div id="stops">
      <button class="stop" data-reel="0" aria-label="左停止"></button>
      <button class="stop" data-reel="1" aria-label="中停止"></button>
      <button class="stop" data-reel="2" aria-label="右停止"></button>
    </div>
  </div>
</div>

<script>
// =====================================================================
//  パチスロ 内部ロジック（抽選・停止制御）
//  画面には依存しないので、ここだけ読めばゲームのルールが分かる。
// =====================================================================
(function (root) {
  'use strict';

  const N = 21;        // 1リールのコマ数
  const MAX_SLIP = 4;  // 最大すべりコマ数
  const PAY_LIMIT = 15;// 1ゲームの最大払い出し

  // ---- 図柄コード ----------------------------------------------------
  //  R=リプレイ  B=ベル  7=赤7  F=青7(しゃちのすけ / 画像 frog7.png)  O=オレンジ
  //  C=チェリー  P=花    W=ブルー  X=BAR
  const SYMBOL_NAMES = {
    R: 'リプレイ', B: 'ベル', '7': '赤7', F: '青7', O: 'オレンジ',
    C: 'チェリー', P: '花', W: 'ブルー', X: 'BAR',
  };

  // ---- リール配列（画像の上から下の順。index 0 = 1番） ----------------
  //  リールは下向きに回るので、時間とともに中段の index は減っていく。
  const STRIPS = [
    'RB7ORBOPOWBRBOFORBXCO'.split(''), // 左
    'CR7OBCROBWRBORFBOXROB'.split(''), // 中
    'OC7BROWBROBFROBXROCBR'.split(''), // 右
  ];

  // ---- 有効ライン（各リールの段 0=上 1=中 2=下） -----------------------
  const LINES = [
    [0, 0, 0], // 上段
    [1, 1, 1], // 中段
    [2, 2, 2], // 下段
    [0, 1, 2], // 右下がり
    [2, 1, 0], // 右上がり
  ];

  // ---- 役 --------------------------------------------------------------
  //  pat: 左中右それぞれ「止まってよい図柄」の文字列。'*' は ANY。
  //  flag: その役をそろえてよい内部フラグ名。
  const ROLES = [
    { id: 'BIG_R',  flag: 'BIG_RED',  name: '赤7 BIG BONUS', pat: ['7', '7', '7'], pay: 0 },
    { id: 'BIG_F',  flag: 'BIG_BLUE', name: '青7 BIG BONUS', pat: ['F', 'F', 'F'], pay: 0 },
    { id: 'REG_R',  flag: 'REG',    name: 'REGULAR BONUS', pat: ['7', '7', 'X'], pay: 0 },
    { id: 'REG_F',  flag: 'REG',    name: 'REGULAR BONUS', pat: ['F', 'F', 'X'], pay: 0 },
    { id: 'REPLAY', flag: 'REPLAY', name: 'リプレイ',       pat: ['RW', 'R', 'R'], pay: 0 },
    { id: 'BELL',   flag: 'BELL',   name: 'ベル',           pat: ['B', 'B', 'B'], pay: 6 },
    { id: 'ORANGE', flag: 'ORANGE', name: 'オレンジ',       pat: ['O', 'O', 'O'], pay: 10 },
    { id: 'CHERRY', flag: 'CHERRY', name: 'チェリー',       pat: ['CP', '*', '*'], pay: 1 },
    // ボーナス中専用役（通常時は絶対にそろえない）
    { id: 'B_FOW',  flag: 'BONUS_ONLY', name: '青7-オレンジ-ブルー', pat: ['F', 'O', 'W'], pay: 15 },
    { id: 'B_FOO',  flag: 'BONUS_ONLY', name: '青7-オレンジ-オレンジ', pat: ['F', 'O', 'O'], pay: 6 },
  ];

  // ---- 通常時の抽選テーブル（分母 65536） ------------------------------
  //  ここを書き換えれば確率を調整できる。
  //  ボーナスは下の「ゲーム性」のルートからだけ発生させるので、直接抽選は入れていない。
  //  直接抽選も入れたいときは { flag: 'BIG_RED', n: 273 } のように足す。
  const FLAG_TABLE = [
    { flag: 'REPLAY', n: 10082 }, // 約 1/6.5
    { flag: 'BELL',   n: 9362  }, // 約 1/7
    { flag: 'ORANGE', n: 2341  }, // 約 1/28
    { flag: 'CHERRY', n: 1638  }, // 約 1/40
  ];

  // ---- ボーナス持ち越し中の抽選テーブル（リプレイだけ） ----------------
  const HELD_TABLE = [
    { flag: 'REPLAY', n: 10082 }, // 約 1/6.5（それ以外はハズレ＝ボーナスを狙えるゲーム）
  ];

  // ---- ゲーム性 --------------------------------------------------------
  const BONUS_FLAGS = ['BIG_BLUE', 'BIG_RED', 'REG'];
  const CHANCE_ROLES = ['BELL', 'ORANGE', 'CHERRY'];  // チャンス中にプレミアムになる小役
  // 調整用の数値（ここを変えるとゲームバランスが変わる）
  //  今の値で機械割 約102%（完璧な目押し）、ボーナス合算 約1/36 になるよう調整済み
  const CONFIG = {
    STREAK_TO_BONUS: 3,     // 同じ小役が何ゲーム連続で成立したら発動するか
    CHERRY_TO_ORANGE: 0.75, // チェリー成立 → 次ゲームがオレンジになる確率
    ORANGE_CHAIN: 0.7,      // オレンジ成立 → 次ゲームもオレンジになる確率
    PREMIUM_LOOP: 0.8,      // プレミアム後、ボーナスが終わるたびに青7 BIG が続く確率
    // ボーナスゲーム：毎ゲームベルが成立して BONUS_PAY 枚。払い出しの合計が END を「超えたら」終了
    //  BIG_END 15 → 15枚×2ゲーム＝30枚（純増24枚）、REG_END 10 → 15枚×1ゲーム（純増12枚）
    BONUS_PAY: 15,
    BIG_END: 15,
    REG_END: 10,
  };

  const FLAG_NAMES = {
    BIG_BLUE: '青7 BIG', BIG_RED: '赤7 BIG', REG: 'REG', REPLAY: 'リプレイ', BELL: 'ベル',
    ORANGE: 'オレンジ', CHERRY: 'チェリー',
  };

  // ---- 共通関数 --------------------------------------------------------
  const mod = (a, n = N) => ((a % n) + n) % n;

  // pos = 中段に止まっている図柄の index、row = 0上 1中 2下
  function symAt(reel, pos, row) {
    return STRIPS[reel][mod(pos - 1 + row)];
  }

  function match(sym, p) {
    return p === '*' || p.indexOf(sym) >= 0;
  }

  // ある役のあるラインの状態: 'aligned'(そろった) / 'possible'(まだそろう可能性) / 'dead'
  function lineState(role, stops, line) {
    let aligned = true;
    for (let r = 0; r < 3; r++) {
      const p = role.pat[r];
      if (p === '*') continue;
      if (stops[r] === null) {
        aligned = false; // 未停止リールはどこにでも止まれるとみなす
      } else if (!match(symAt(r, stops[r], line[r]), p)) {
        return 'dead';
      }
    }
    return aligned ? 'aligned' : 'possible';
  }

  function alignedLines(role, stops) {
    const res = [];
    LINES.forEach((line, i) => { if (lineState(role, stops, line) === 'aligned') res.push(i); });
    return res;
  }

  function possibleLineCount(role, stops) {
    let c = 0;
    for (const line of LINES) if (lineState(role, stops, line) !== 'dead') c++;
    return c;
  }

  function lottery(rand = Math.random, table = FLAG_TABLE) {
    const r = Math.floor(rand() * 65536);
    let acc = 0;
    for (const e of table) {
      acc += e.n;
      if (r < acc) return e.flag;
    }
    return null; // ハズレ
  }

  // スコア比較（配列の辞書順で小さいほうが良い）
  function better(a, b) {
    for (let i = 0; i < a.length; i++) {
      if (a[i] !== b[i]) return a[i] < b[i];
    }
    return false;
  }

  // ---- 先読み制御 ------------------------------------------------------
  //  全リール停止時: 狙い役がそろえば 1、フラグ無し役がそろえば -10、それ以外 0。
  //  途中: 残りの各リールについて「21通りの押し位置 × 最善のすべり(0〜4)」の平均。
  //  結果は狙い役ごとにメモしておくので2回目以降は一瞬で終わる。
  const memos = {};
  function getMemo(targetList) {
    const key = targetList.map(r => r.id).join('+') || 'NONE';
    return memos[key] || (memos[key] = new Map());
  }

  function lookAhead(stops, targets, memo) {
    const key = stops.join(',');
    const hit = memo.get(key);
    if (hit !== undefined) return hit;
    let value;
    if (stops.every(s => s !== null)) {
      value = 0;
      for (const role of ROLES) {
        if (!alignedLines(role, stops).length) continue;
        if (targets.has(role.id)) value = Math.max(value, 1);
        else { value = -10; break; }
      }
    } else {
      let sum = 0, cnt = 0;
      for (let r = 0; r < 3; r++) {
        if (stops[r] !== null) continue;
        for (let p = 0; p < N; p++) {
          let best = -Infinity;
          for (let k = 0; k <= MAX_SLIP; k++) {
            const t = stops.slice();
            t[r] = mod(p - k);
            best = Math.max(best, lookAhead(t, targets, memo));
          }
          sum += best; cnt++;
        }
      }
      value = Math.round(sum / cnt * 1e9) / 1e9;
    }
    memo.set(key, value);
    return value;
  }

  // =====================================================================
  //  ゲーム進行
  // =====================================================================
  class SlotLogic {
    constructor() {
      this.bonusFlag = null;    // 持ち越し中のボーナスフラグ ('BIG_BLUE' | 'BIG_RED' | 'REG' | null)
      this.smallFlag = null;    // このゲームの小役フラグ
      this.stops = [null, null, null];
      this.streakFlag = null;   // 連続成立を数えている小役
      this.streakCount = 0;     // その連続回数
      this.forceOrange = false; // 次ゲームはオレンジ確定
      this.chance = false;      // 次ゲームがしゃちのすけチャンス
      this.loop = false;        // プレミアムの青7 BIG ループ中
      this.bonusGame = null;    // ボーナスゲーム中 { type, paid }（null なら通常）
      this.inBonusNow = false;  // このゲームがボーナスゲームか
      this.events = [];         // このゲームで起きた出来事（画面表示用）
    }

    bonusEnd(type) { return type === 'REG' ? CONFIG.REG_END : CONFIG.BIG_END; }

    // ボーナスフラグを立てる（すでに持っているときは何もしない）
    setBonus(flag, event) {
      if (this.bonusFlag) return false;
      this.bonusFlag = flag;
      this.events.push(event);
      return true;
    }

    // レバーON：抽選する
    startGame(rand = Math.random) {
      this.events = [];
      this.stops = [null, null, null];
      // ボーナスゲーム中：毎ゲームベル成立（払い出しは BONUS_PAY 枚）。通常の抽選・連続カウントはしない
      this.inBonusNow = !!this.bonusGame;
      if (this.inBonusNow) {
        this.smallFlag = 'BELL';
        return { smallFlag: this.smallFlag, bonusFlag: this.bonusFlag, events: this.events };
      }
      let f;
      if (this.bonusFlag) {
        // ボーナス持ち越し中はリプレイだけを抽選（次オレンジの予約も消える）
        f = lottery(rand, HELD_TABLE);
      } else if (this.forceOrange) {
        f = 'ORANGE'; this.events.push('ORANGE_FORCED');
      } else {
        f = lottery(rand);
      }
      this.forceOrange = false;

      // 直接抽選のボーナス（FLAG_TABLE に入れた場合だけ）
      if (BONUS_FLAGS.includes(f)) { this.setBonus(f, 'BONUS_DIRECT'); f = null; }
      this.smallFlag = f;

      // しゃちのすけチャンスのゲーム：小役が成立したらプレミアム（REG＋青7 BIG ループ）
      if (this.chance) {
        this.chance = false;
        if (CHANCE_ROLES.includes(f) && this.setBonus('REG', 'PREMIUM')) this.loop = true;
        else this.events.push('CHANCE_MISS');
      }

      // 連続成立を数える
      if (f && f === this.streakFlag) this.streakCount++;
      else { this.streakFlag = f; this.streakCount = f ? 1 : 0; }
      if (this.streakCount >= CONFIG.STREAK_TO_BONUS) {
        let fired = false;
        if (f === 'BELL') fired = this.setBonus('BIG_BLUE', 'BELL3');
        else if (f === 'ORANGE') fired = this.setBonus('BIG_RED', 'ORANGE3');
        else if (f === 'REPLAY' && !this.bonusFlag) { this.chance = true; this.events.push('CHANCE'); fired = true; }
        if (fired) { this.streakFlag = null; this.streakCount = 0; }
      }

      // チェリー・オレンジ → 次ゲームのオレンジ
      if (f === 'CHERRY' && rand() < CONFIG.CHERRY_TO_ORANGE) this.forceOrange = true;
      if (f === 'ORANGE' && rand() < CONFIG.ORANGE_CHAIN) this.forceOrange = true;

      return { smallFlag: this.smallFlag, bonusFlag: this.bonusFlag, events: this.events };
    }

    // 今ゲームでそろえに行く役（小役が優先、小役がなければ持ち越しボーナス）
    targetRoles() {
      const flag = this.smallFlag || this.bonusFlag;
      return flag ? ROLES.filter(r => r.flag === flag) : [];
    }

    // 停止ボタンが押された：pressPos(押した瞬間の中段図柄) から 0〜4コマの中で止める位置を決める
    decideStop(reel, pressPos) {
      const targetList = this.targetRoles();
      const targets = new Set(targetList.map(r => r.id));
      const memo = getMemo(targetList);
      let best = null;
      for (let k = 0; k <= MAX_SLIP; k++) {
        const pos = mod(pressPos - k);
        const trial = this.stops.slice();
        trial[reel] = pos;
        // 先読み：この位置で止めた後、残りリールをどのタイミングで押されても
        // 最善の制御をしたとき、狙い役がそろう確率（フラグ無し役がそろうと大きく減点）
        const value = lookAhead(trial, targets, memo);
        let avoidLines = 0;// フラグの無い役がそろう可能性のあるライン数（少ないほど良い）
        for (const role of ROLES) {
          if (!targets.has(role.id)) avoidLines += possibleLineCount(role, trial);
        }
        const score = [-value, avoidLines, k];
        if (!best || better(score, best.score)) best = { pos, slip: k, score };
      }
      this.stops[reel] = best.pos;
      return best;
    }

    // 全リール停止：入賞判定
    finishGame(rand = Math.random) {
      const wins = [];
      for (const role of ROLES) {
        const lines = alignedLines(role, this.stops);
        if (!lines.length) continue;
        // ボーナスゲーム中の小役は BONUS_PAY 枚
        const unit = this.inBonusNow && role.pay > 0 ? CONFIG.BONUS_PAY : role.pay;
        wins.push({ role, lines, pay: unit * lines.length });
      }
      const total = Math.min(PAY_LIMIT, wins.reduce((s, w) => s + w.pay, 0));

      if (this.inBonusNow) {
        // ボーナスゲーム：払い出しの合計が終了枚数を超えたら終わり
        this.bonusGame.paid += total;
        if (this.bonusGame.paid > this.bonusEnd(this.bonusGame.type)) {

          this.bonusGame = null;

          if (this.loop) {

            else { this.loop = false; this.events.push('LOOP_END'); }
          }

      } else if (this.bonusFlag && wins.some(w => w.role.flag === this.bonusFlag)) {
        // ボーナスがそろった → 次ゲームからボーナスゲーム
        this.bonusGame = { type: this.bonusFlag, paid: 0 };
        this.bonusFlag = null;
        this.events.push('BONUS_START');
      }
      return wins;
    }

    // ボーナスを持っている間（ボーナスゲーム前）はメダルを使わない
    isFreeGame() { return this.bonusFlag !== null; }
  }

  const api = {
    N, MAX_SLIP, STRIPS, LINES, ROLES, FLAG_TABLE, HELD_TABLE, FLAG_NAMES, SYMBOL_NAMES, BONUS_FLAGS,

  };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.SlotLogicLib = api;

<script>
'use strict';
const { N, STRIPS, LINES, FLAG_NAMES, mod, SlotLogic } = SlotLogicLib;

// ---- 設定 ----
const SPEED = 80 * N / 60;   // 80回転/分 → 1秒あたりのコマ数
const ACCEL_TIME = 0.3;      // 回転開始から定速になるまで(秒)

const logic = new SlotLogic();
const canvas = document.getElementById('reels');
const ctx = canvas.getContext('2d');
const resultEl = document.getElementById('result');
const debugEl = document.getElementById('debug');
const showFlagEl = document.getElementById('showFlag');
const stopBtns = [...document.querySelectorAll('.stop')];
const leverBtn = document.getElementById('lever');

// リールの状態。pos は中段にある図柄の index（小数で回転中を表現）
const reels = [0, 1, 2].map(() => ({
  pos: Math.floor(Math.random() * N), speed: 0, state: 'stopped', target: 0, slip: 0,
}));
let wins = [];
let gameInfo = null;

// =================== メダル（クレジット・ベット） ===================
const CREDIT_MAX = 50;        // クレジットの上限。超えた分は手持ちメダルへ
const BET_MAX = 3;            // 1ゲームに必要な枚数（5ライン有効）
const LEND_UNIT = 50;         // 貸出ボタン1回の枚数
const PAY_MAX = 15;           // 1ゲームの最大払い出し
const PAYOUT_INTERVAL = 0.06; // 払い出し1枚ごとの間隔（秒）
const SAVE_KEY = 'shachinosuke-medals';

// メダルの状態はブラウザに保存しておき、再読み込みしても続きから遊べるようにする
function loadSaved() {
  try { return JSON.parse(localStorage.getItem(SAVE_KEY) || '{}'); } catch (e) { return {}; }
}
function save(data) {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(data)); } catch (e) { /* 保存できない環境では無視 */ }
}
const medals = Object.assign({ credit: 0, hand: 0, invest: 0, games: 0 }, loadSaved());
// 前回ベットしたまま閉じた場合は、その枚数をクレジットに戻す
const savedBet = medals.bet || 0;
const savedFree = !!medals.free;
// ボーナス持ち越し・連続回数などのゲーム性の状態も復元する
const LOGIC_KEYS = ['bonusFlag', 'streakFlag', 'streakCount', 'forceOrange', 'chance', 'loop', 'bonusGame'];
if (medals.logic) for (const k of LOGIC_KEYS) if (k in medals.logic) logic[k] = medals.logic[k];
delete medals.bet; delete medals.free; delete medals.logic;
if (savedBet) addToCredit(savedBet);
let replayBet = savedFree || logic.isFreeGame();  // メダルを使わない自動ベット中（リプレイ・ボーナス持ち越し）
let bet = replayBet ? 3 : 0;                      // 現在のベット枚数
let payQueue = 0;       // これから払い出す枚数
let payShown = 0;       // 今回払い出した枚数（PAY表示）
let payTimer = 0;

// ---- 7セグメントの数字（SVG） ----
//  a〜g の7本の線のうち、点灯する線を明るく、消えている線を暗く描く。
//    aaa
//   f   b
//    ggg
//   e   c
//    ddd
const SEG_T = 10;   // 線の太さ
function hSeg(x1, x2, cy) {
  const h = SEG_T / 2;
  return `${x1},${cy} ${x1 + h},${cy - h} ${x2 - h},${cy - h} ${x2},${cy} ${x2 - h},${cy + h} ${x1 + h},${cy + h}`;
}
function vSeg(cx, y1, y2) {
  const h = SEG_T / 2;
  return `${cx},${y1} ${cx + h},${y1 + h} ${cx + h},${y2 - h} ${cx},${y2} ${cx - h},${y2 - h} ${cx - h},${y1 + h}`;
}
const SEG_SHAPES = {
  a: hSeg(9, 51, 6),   g: hSeg(9, 51, 50),  d: hSeg(9, 51, 94),
  f: vSeg(6, 9, 47),   b: vSeg(54, 9, 47),
  e: vSeg(6, 53, 91),  c: vSeg(54, 53, 91),
};
const SEG_DIGITS = ['abcdef', 'bc', 'abged', 'abgcd', 'fgbc', 'afgcd', 'afgedc', 'abc', 'abcdefg', 'abcdfg'];
const SEG_SVGS = SEG_DIGITS.map(on =>
  `<svg viewBox="0 0 60 100"><g transform="translate(6 0) skewX(-6)">` +
  Object.entries(SEG_SHAPES).map(([k, pts]) =>
    `<polygon class="${on.includes(k) ? 'on' : 'off'}" points="${pts}"/>`).join('') +
  `</g></svg>`);

// ---- 数字が縦に回るカウンター表示 ----
//  set(値) で目標値を決めると、1ずつ数字を回しながら近づく。
//  増えるときは数字が上へ、減るときは下へ流れる。
const COUNT_STEP = 0.05;      // 1カウントの間隔（秒）
const COUNT_STEP_FAST = 0.025;// 差が大きいとき（貸出など）の間隔
class RollCounter {
  constructor(el, digits = 2) {
    this.digits = [];
    for (let i = 0; i < digits; i++) {
      const d = document.createElement('span');
      d.className = 'digit';
      const strip = document.createElement('span');
      strip.className = 'strip';
      // 0〜9 の下にもう一つ 0 を置き、9→0 / 0→9 を途切れずに回せるようにする
      for (let n = 0; n <= 10; n++) {
        const s = document.createElement('span');
        s.innerHTML = SEG_SVGS[n % 10];
        strip.appendChild(s);
      }
      strip.addEventListener('transitionend', () => {
        if (this.digits[i].pos === 10) this.snap(i, 0);   // 一番下の 0 から上の 0 へ瞬間移動
      });
      d.appendChild(strip);
      el.appendChild(d);
      this.digits.push({ strip, pos: 0 });
    }
    this.shown = 0;
    this.target = 0;
    this.timer = 0;
  }

  move(i, pos) {
    this.digits[i].pos = pos;
    this.digits[i].strip.style.transform = `translateY(${-pos}em)`;
  }

  snap(i, pos) {   // アニメーションなしで位置を変える
    const s = this.digits[i].strip;
    s.style.transition = 'none';
    this.move(i, pos);
    void s.offsetHeight;
    s.style.transition = '';
  }

  digitsOf(v) {
    return String(v).padStart(this.digits.length, '0').slice(-this.digits.length).split('').map(Number);
  }

  // 1桁を dir の向き（+1 上へ / -1 下へ）に回して to にする
  roll(i, to, dir) {
    let from = this.digits[i].pos;
    if (from === 10) { this.snap(i, 0); from = 0; }
    if (to === from) return;
    if (dir > 0 && from === 9 && to === 0) this.move(i, 10);          // 9 → 下の0 へ
    else if (dir < 0 && from === 0 && to === 9) { this.snap(i, 10); this.move(i, 9); } // 下の0 → 9
    else this.move(i, to);
  }

  render(dir) {
    this.digitsOf(this.shown).forEach((n, i) => this.roll(i, n, dir));
  }

  set(v) { this.target = v; }

  jump(v) {   // 回さずに即座に表示を変える
    this.shown = this.target = v;
    this.digitsOf(v).forEach((n, i) => this.snap(i, n));
  }

  update(dt) {
    const diff = this.target - this.shown;
    const interval = Math.abs(diff) > 10 ? COUNT_STEP_FAST : COUNT_STEP;
    if (diff === 0) { this.timer = interval; return; }   // 次の変化は1カウント目をすぐ出す
    this.timer += dt;
    while (this.timer >= interval && this.shown !== this.target) {
      this.timer -= interval;
      const dir = Math.sign(this.target - this.shown);
      this.shown += dir;
      this.render(dir);
    }
  }
}

const creditCounter = new RollCounter(document.getElementById('creditDisp'));
const payCounter = new RollCounter(document.getElementById('payDisp'));
const betLamps = [...document.querySelectorAll('#betLamps .lamp')];
const replayLamp = document.getElementById('replayLamp');
const statsEl = document.getElementById('stats');
const lendBtn = document.getElementById('lendBtn');
const settleBtn = document.getElementById('settleBtn');

// リール停止中かつ払い出しが終わっていれば操作できる
function canOperate() {
  return reels.every(r => r.state === 'stopped') && payQueue === 0;
}

function addToCredit(n) {
  const c = Math.min(n, CREDIT_MAX - medals.credit);
  medals.credit += c;
  medals.hand += n - c;
}

function renderMedals() {
  creditCounter.set(medals.credit);
  if (payShown === 0) payCounter.jump(0);   // PAY は新しいゲームで即0に戻す
  else payCounter.set(payShown);
  betLamps.forEach((l, i) => l.classList.toggle('on', i < bet));
  replayLamp.classList.toggle('on', replayBet);
  const diff = medals.credit + medals.hand + (replayBet ? 0 : bet) - medals.invest;
  statsEl.textContent = `手持ち ${medals.hand}枚　投資 ${medals.invest}枚　差枚 ${diff >= 0 ? '+' : ''}${diff}枚　${medals.games}G`;
  const logicState = {};
  for (const k of LOGIC_KEYS) logicState[k] = logic[k];
  save({ ...medals, bet: replayBet ? 0 : bet, free: replayBet, logic: logicState });
}

function maxBet() {
  if (!canOperate() || bet >= BET_MAX) return;
  const need = BET_MAX - bet;
  if (medals.credit + medals.hand < need) {
    resultEl.textContent = 'メダルが足りません（貸出を押してください）';
    return;
  }
  const fromCredit = Math.min(need, medals.credit);   // クレジットから優先して使う
  medals.credit -= fromCredit;
  medals.hand -= need - fromCredit;
  bet = BET_MAX;
  payShown = 0;
  resultEl.textContent = '';
  renderMedals();
}

function lend() {
  if (!canOperate()) return;
  medals.invest += LEND_UNIT;
  addToCredit(LEND_UNIT);
  renderMedals();
}

// 精算：クレジット（と、メダルで掛けたベット）を手持ちに戻す
function settle() {
  if (!canOperate()) return;
  if (!replayBet) { medals.hand += bet; bet = 0; }
  medals.hand += medals.credit;
  medals.credit = 0;
  renderMedals();
}

function updatePayout(dt) {
  if (payQueue <= 0) return;
  payTimer += dt;
  while (payTimer >= PAYOUT_INTERVAL && payQueue > 0) {
    payTimer -= PAYOUT_INTERVAL;
    payQueue--;
    payShown++;
    addToCredit(1);
  }
  renderMedals();
}

// =================== 描画 ===================
let dpr = 1, W = 0, H = 0, cellW = 0, cellH = 0, gap = 0;
let symbolImages = {};

function resize() {
  const rect = canvas.getBoundingClientRect();
  dpr = window.devicePixelRatio || 1;
  W = rect.width; H = rect.height;

}

function emoji(c, ch, cx, cy, size) {

}

function draw7(c, w, h, fill, stroke) {

function roundRect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);

}

function drawSymbol(c, s, w, h) {
  const cx = w / 2, cy = h / 2;
  switch (s) {
    case '7': draw7(c, w, h, '#e60012', '#5a0000'); break;

    case 'O': emoji(c, '🍊', cx, cy, h * 0.68); break;

    case 'P': emoji(c, '🌸', cx, cy, h * 0.68); break;

}

// 図柄はあらかじめ画像化しておき、毎フレームはコピーするだけにする
function buildSymbols() {
  symbolImages = {};

    const off = document.createElement('canvas');
    off.width = Math.round(cellW * dpr); off.height = Math.round(cellH * dpr);
    const c = off.getContext('2d');

    if (img) drawImageFit(c, img, cellW, cellH);
    else drawSymbol(c, s, cellW, cellH);   // 画像が無ければ標準の絵

  }
}

// ---- 絵柄画像の読み込み ----
//  index.html と同じ場所の symbols フォルダに下の名前で画像を置くと、その画像を使う。
//  無い絵柄は標準の絵のまま。png 以外の拡張子も順に探す。
// 画像を差し替えたらこの番号を上げる（ブラウザに残った古い画像を使わせないため）
const ASSET_VERSION = 2;
const SYMBOL_FILES = {
  '7': 'red7', F: 'frog7', X: 'bar', R: 'replay', W: 'blue',
  B: 'bell', O: 'orange', C: 'cherry', P: 'flower',
};
const IMAGE_EXTS = ['png', 'webp', 'jpg', 'jpeg'];
const SYMBOL_PADDING = 0.06;   // コマの上下左右に空ける余白（コマサイズに対する割合）
const customImages = {};

// 縦横比を保ったままコマに収めて中央に描く
function drawImageFit(c, img, w, h) {
  const bw = w * (1 - SYMBOL_PADDING * 2), bh = h * (1 - SYMBOL_PADDING * 2);
  const scale = Math.min(bw / img.naturalWidth, bh / img.naturalHeight);
  const dw = img.naturalWidth * scale, dh = img.naturalHeight * scale;
  c.imageSmoothingQuality = 'high';
  c.drawImage(img, (w - dw) / 2, (h - dh) / 2, dw, dh);
}

function loadSymbolImage(sym, name, extIndex = 0) {
  if (extIndex >= IMAGE_EXTS.length) return;   // 見つからない → 標準の絵
  const img = new Image();
  img.onload = () => { customImages[sym] = img; buildSymbols(); };
  img.onerror = () => loadSymbolImage(sym, name, extIndex + 1);
  img.src = `symbols/${name}.${IMAGE_EXTS[extIndex]}?v=${ASSET_VERSION}`;
}

for (const [sym, name] of Object.entries(SYMBOL_FILES)) loadSymbolImage(sym, name);

// ---- キャラクター画像（リールの左） ----
//  元画像は背景のチェック柄（透明っぽく見える格子）が絵として描き込まれているので、
//  画像の外周からつながっている「白〜明るい灰色」の部分を透明にしてから表示する。
//  キャラは黒い輪郭で囲まれているので、白いお腹や目は消えない。
//  本当に背景が透明な PNG に差し替えた場合は、この処理は何もしないのと同じになる。
const CHARA_SRC = `shachinosuke.webp?v=${ASSET_VERSION}`;
const charaEl = document.getElementById('chara');

function removeFakeBackground(img) {
  const w = img.naturalWidth, h = img.naturalHeight;
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const c = cv.getContext('2d');
  c.drawImage(img, 0, 0);
  const data = c.getImageData(0, 0, w, h);
  const p = data.data;
  const isBg = k => {   // 白〜明るい灰色で、色味が少ない画素
    const i = k * 4, r = p[i], g = p[i + 1], b = p[i + 2];
    return p[i + 3] > 0 && Math.min(r, g, b) >= 150 && Math.max(r, g, b) - Math.min(r, g, b) <= 30;
  };
  // 外周から塗りつぶし（つながっている背景だけを透明にする）
  const seen = new Uint8Array(w * h);
  const stack = [];
  const visit = k => { if (!seen[k] && isBg(k)) { seen[k] = 1; stack.push(k); } };
  for (let x = 0; x < w; x++) { visit(x); visit((h - 1) * w + x); }
  for (let y = 0; y < h; y++) { visit(y * w); visit(y * w + w - 1); }
  while (stack.length) {
    const k = stack.pop();
    p[k * 4 + 3] = 0;
    const x = k % w;
    if (x > 0) visit(k - 1);
    if (x < w - 1) visit(k + 1);
    if (k >= w) visit(k - w);
    if (k < w * (h - 1)) visit(k + w);
  }
  // 輪郭のまわりに残った明るいフチを2回削る
  for (let pass = 0; pass < 2; pass++) {
    const del = [];
    for (let k = 0; k < w * h; k++) {
      const i = k * 4;
      if (p[i + 3] === 0) continue;
      const x = k % w;
      const nearClear = (x > 0 && p[i - 4 + 3] === 0) || (x < w - 1 && p[i + 4 + 3] === 0) ||
                        (k >= w && p[i - w * 4 + 3] === 0) || (k < w * (h - 1) && p[i + w * 4 + 3] === 0);
      if (nearClear && Math.min(p[i], p[i + 1], p[i + 2]) >= 120) del.push(i);
    }
    for (const i of del) p[i + 3] = 0;
  }
  c.putImageData(data, 0, 0);
  return cv.toDataURL('image/png');
}

(function loadChara() {
  const img = new Image();
  img.onload = () => {
    try { charaEl.src = removeFakeBackground(img); }
    catch (e) { charaEl.src = img.src; }   // 加工できない環境ではそのまま表示
    charaEl.classList.add('ready');
  };
  img.onerror = () => { charaEl.style.display = 'none'; };   // 画像が無ければリールだけ
  img.src = CHARA_SRC;
})();

function reelX(i) { return gap + i * (cellW + gap); }

function draw(time) {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#111';
  ctx.fillRect(0, 0, W, H);

  for (let i = 0; i < 3; i++) {
    const r = reels[i];
    const x = reelX(i), y0 = gap;
    const winH = cellH * 3;
    ctx.save();
    ctx.beginPath(); ctx.rect(x, y0, cellW, winH); ctx.clip();
    // リール地（白）
    const g = ctx.createLinearGradient(0, y0, 0, y0 + winH);
    g.addColorStop(0, '#bbb'); g.addColorStop(0.5, '#fff'); g.addColorStop(1, '#bbb');
    ctx.fillStyle = g; ctx.fillRect(x, y0, cellW, winH);
    // 図柄: index j の中心 y = 中段中心 + (j - pos) * cellH
    const base = Math.floor(r.pos);
    for (let j = base - 2; j <= base + 3; j++) {
      const cy = y0 + cellH * 1.5 + (j - r.pos) * cellH;
      const img = symbolImages[STRIPS[i][mod(j)]];
      ctx.drawImage(img, x, cy - cellH / 2, cellW, cellH);
    }
    // 上下の影
    const sh = ctx.createLinearGradient(0, y0, 0, y0 + winH);
    sh.addColorStop(0, 'rgba(0,0,0,0.35)'); sh.addColorStop(0.15, 'rgba(0,0,0,0)');
    sh.addColorStop(0.85, 'rgba(0,0,0,0)'); sh.addColorStop(1, 'rgba(0,0,0,0.35)');
    ctx.fillStyle = sh; ctx.fillRect(x, y0, cellW, winH);
    ctx.restore();
  }

  // 入賞ラインの表示（点滅）
  if (wins.length && Math.floor(time / 300) % 2 === 0) {
    ctx.lineWidth = Math.max(4, cellH * 0.06);
    ctx.lineCap = 'round';
    for (const w of wins) {
      ctx.strokeStyle = w.role.flag === 'BIG' || w.role.flag === 'REG' ? 'rgba(255,40,40,0.8)' : 'rgba(255,200,0,0.8)';
      for (const li of w.lines) {
        const line = LINES[li];
        ctx.beginPath();
        for (let i = 0; i < 3; i++) {
          const px = reelX(i) + cellW / 2;
          const py = gap + cellH * (line[i] + 0.5);
          if (i === 0) ctx.moveTo(px - cellW * 0.45, py);
          ctx.lineTo(px, py);
          if (i === 2) ctx.lineTo(px + cellW * 0.45, py);
        }
        ctx.stroke();
      }
    }
  }
}

// =================== ゲーム進行 ===================
function updateButtons() {
  stopBtns.forEach((b, i) => b.classList.toggle('on', reels[i].state === 'spin'));
}

function updateDebug() {
  if (!showFlagEl.checked || !gameInfo) { debugEl.textContent = ''; return; }
  const small = gameInfo.smallFlag ? FLAG_NAMES[gameInfo.smallFlag] : 'ハズレ';
  const bonus = logic.bonusFlag ? ` / 持越: ${FLAG_NAMES[logic.bonusFlag]}` : '';
  const streak = logic.streakCount ? ` / ${FLAG_NAMES[logic.streakFlag]}${logic.streakCount}連` : '';
  const extra = (logic.forceOrange ? ' / 次オレンジ' : '') + (logic.chance ? ' / 次チャンス' : '') +
                (logic.loop ? ' / ループ中' : '');
  const slips = reels.map(r => r.state === 'stopped' ? r.slip : '-').join(' ');
  debugEl.textContent = `フラグ: ${small}${bonus}${streak}${extra}　すべり: ${slips}`;
}

// ゲーム性の出来事を画面に出す文
const EVENT_TEXT = {
  BELL3: 'ベル3連！ 青7 BIG 確定',
  ORANGE3: 'オレンジ3連！ 赤7 BIG 確定',
  CHANCE: 'しゃちのすけチャンス！',
  PREMIUM: 'プレミアム！！',
  LOOP: '青7 BIG 継続！',
  LOOP_END: 'ループ終了',
};
function eventMessages() {
  const msgs = logic.events.filter(e => EVENT_TEXT[e]).map(e => EVENT_TEXT[e]);
  // ボーナスゲームの開始・途中経過・終了
  if (logic.events.includes('BONUS_START')) msgs.push(`${FLAG_NAMES[logic.bonusGame.type]} スタート！`);
  else if (logic.bonusGame) msgs.push(`${FLAG_NAMES[logic.bonusGame.type]} 中 ${logic.bonusGame.paid}枚`);
  if (logic.events.includes('BONUS_END')) msgs.unshift(`${FLAG_NAMES[logic.lastBonus.type]} 終了 ${logic.lastBonus.paid}枚`);
  return msgs;
}

// ---- 吹き出しのセリフ（毎ゲーム、前回と違うものを選ぶ） ----
const LINES_SPEECH = ['しゃ！？', 'しょ！？', 'しょうちのすけ', 'しょうちしました'];
const bubbleEl = document.getElementById('bubble');
let lastSpeech = -1;
// ボーナスを持っている間は、狙う図柄を教えるセリフに固定
const BONUS_SPEECH = {
  BIG_BLUE: '青７を狙うんす',
  BIG_RED: '赤７を狙うんす',
  REG: 'ＢＡＲを狙うんす',
};

function showSpeech(text) {
  bubbleEl.textContent = text;
  bubbleEl.classList.remove('pop');
  void bubbleEl.offsetWidth;          // アニメーションをやり直すため
  bubbleEl.classList.add('pop');
}

function speak() {
  if (logic.bonusFlag) { showSpeech(BONUS_SPEECH[logic.bonusFlag]); return; }
  // 前回以外の中から1つ選ぶ（ループしない書き方）
  let i = Math.floor(Math.random() * (LINES_SPEECH.length - (lastSpeech >= 0 ? 1 : 0)));
  if (lastSpeech >= 0 && i >= lastSpeech) i++;
  lastSpeech = i;
  showSpeech(LINES_SPEECH[i]);
}

// ゲーム終了時：ボーナスが立った・変わった（ループ継続など）ならすぐセリフを切り替える
function speakAfterGame() {
  const text = logic.bonusFlag ? BONUS_SPEECH[logic.bonusFlag] : null;
  if (text && bubbleEl.textContent !== text) showSpeech(text);
}

function pullLever() {
  if (!canOperate()) return;
  if (bet < BET_MAX) maxBet();        // レバーを叩くと自動で3枚掛け
  if (bet < BET_MAX) return;          // メダル不足（maxBet がメッセージを出す）
  speak();
  gameInfo = logic.startGame();
  medals.games++;
  wins = [];
  payShown = 0;
  resultEl.textContent = '';
  for (const r of reels) { r.state = 'accel'; r.speed = 0; r.slip = 0; }
  renderMedals();
  updateDebug();
}

function pressStop(i) {
  const r = reels[i];
  if (r.state !== 'spin') return;
  const pressPos = Math.floor(r.pos);          // 次に中段へ来る図柄
  const res = logic.decideStop(i, mod(pressPos));
  r.target = pressPos - res.slip;
  r.slip = res.slip;
  r.state = 'stopping';
  updateButtons();
}

function onAllStopped() {
  wins = logic.finishGame();
  const texts = wins.map(w => w.pay ? `${w.role.name} ${w.pay}枚` : w.role.name).concat(eventMessages());
  resultEl.textContent = texts.join(' / ');
  // 払い出し（1枚ずつクレジットへ）
  payQueue = Math.min(PAY_MAX, wins.reduce((s, w) => s + w.pay, 0));
  payTimer = PAYOUT_INTERVAL;   // 1枚目はすぐ出す
  // ベットは消費。リプレイ、またはボーナス持ち越し中なら次ゲームはメダルを使わずに3枚掛け
  replayBet = wins.some(w => w.role.flag === 'REPLAY') || logic.isFreeGame();
  speakAfterGame();
  bet = replayBet ? BET_MAX : 0;
  renderMedals();
  updateDebug();
}

function update(dt) {
  let anyMoving = false, justStopped = false;
  for (const r of reels) {
    if (r.state === 'stopped') continue;
    anyMoving = true;
    if (r.state === 'accel') {
      r.speed = Math.min(SPEED, r.speed + SPEED * dt / ACCEL_TIME);
      if (r.speed >= SPEED) { r.state = 'spin'; updateButtons(); }
    }
    r.pos -= r.speed * dt;
    if (r.state === 'stopping') {
      if (r.pos <= r.target) {
        r.pos = mod(r.target);
        r.state = 'stopped';
        justStopped = true;
      }
    } else if (r.pos < 0) {
      r.pos += N;
    }
  }
  if (justStopped) {
    updateDebug();
    if (reels.every(r => r.state === 'stopped')) onAllStopped();
  }
  updatePayout(dt);
  creditCounter.update(dt);
  payCounter.update(dt);
}

let last = performance.now();
function frame(t) {
  const dt = Math.min(0.05, (t - last) / 1000);
  last = t;
  update(dt);
  draw(t);
  requestAnimationFrame(frame);
}

// =================== 入力 ===================
// 押した見た目は短いタップでも最低 PRESS_MIN 秒は残す
const PRESS_MIN = 0.15;
function bindPress(el, fn) {
  let downAt = 0;
  el.addEventListener('pointerdown', e => {
    e.preventDefault(); downAt = performance.now(); el.classList.add('pressed'); fn();
  });
  const up = () => {
    const rest = PRESS_MIN * 1000 - (performance.now() - downAt);
    setTimeout(() => el.classList.remove('pressed'), Math.max(0, rest));
  };
  el.addEventListener('pointerup', up);
  el.addEventListener('pointerleave', up);
  el.addEventListener('pointercancel', up);
}
bindPress(leverBtn, pullLever);
bindPress(lendBtn, lend);
bindPress(settleBtn, settle);
stopBtns.forEach((b, i) => bindPress(b, () => pressStop(i)));
showFlagEl.addEventListener('change', updateDebug);

// PCでの確認用キーボード操作: Space=レバー（自動ベット）, Z/X/C または ←↓→ = 停止
window.addEventListener('keydown', e => {
  if (e.repeat) return;
  const k = e.key.toLowerCase();
  if (k === ' ' || k === 'enter' || k === 'arrowup') { e.preventDefault(); pullLever(); }
  else if (k === 'z' || k === 'arrowleft') pressStop(0);
  else if (k === 'x' || k === 'arrowdown') pressStop(1);
  else if (k === 'c' || k === 'arrowright') pressStop(2);
});

window.addEventListener('resize', resize);
resize();
creditCounter.jump(medals.credit);   // 起動時は回さずに表示
renderMedals();
if (logic.bonusFlag) bubbleEl.textContent = BONUS_SPEECH[logic.bonusFlag];   // 持ち越し中なら狙う図柄を表示
resultEl.textContent = medals.credit + medals.hand >= BET_MAX
  ? 'レバーで開始' : '貸出ボタンでメダルを借りてください';
requestAnimationFrame(frame);
</script>
